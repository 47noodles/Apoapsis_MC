plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

evaluationDependsOn(':orbit')

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to players on 26.3.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        // Client runs open at a usable size instead of Minecraft's default 854x480.
        client {
            client()
            programArguments.addAll '--width', '1600', '--height', '900'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Opens straight into the save "Apoapsis Test Flight" (created on first launch): the Kestrel rocket
        // already in low Verdance orbit with you in the cockpit, and a second one on a pad at spawn.
        testFlight {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The test flight driven by a script: screenshots of flight, map and a burn into run/screenshots, then quits.
        testDriver {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The Pale transfer by script: window, prograde burn to an encounter, coast across the SOI, map screenshots.
        testTransfer {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'transfer'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // A launch from the pad by script: SAS hold, full throttle straight up, climb shots, cut after the orbit transition.
        testAscent {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'ascent'
            systemProperty 'apoapsis.testStart', 'pad'
            systemProperty 'apoapsis.testSave', 'Apoapsis Ascent Test'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The same launch, recording render frames: 15 s first person, then 15 s third person (run/screenshots/rec-*).
        testAscentRecord {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'ascent'
            systemProperty 'apoapsis.testStart', 'pad'
            systemProperty 'apoapsis.testRecord', 'true'
            systemProperty 'apoapsis.testSave', 'Apoapsis Ascent Test'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The Pale landing by script: the transfer, a retrograde burn, a coast, a suicide burn, and descent screenshots.
        testPale {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'pale'
            systemProperty 'apoapsis.testSave', 'Apoapsis Pale Test'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // A parachute landing by script: the Kestrel with chutes and legs dropped from 1,200 m, deploy, land, screenshots.
        testLand {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'land'
            systemProperty 'apoapsis.testStart', 'pad'
            systemProperty 'apoapsis.testSave', 'Apoapsis Land Test'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The 3D map by script: a node placed with a click, the prograde handle dragged, the node deleted, the site
        // markers, and the 2D map through Tab; screenshots m08-*.png into run/screenshots, then quits.
        testMap {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'map'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The map screenshot run for the map look: 3D and 2D maps at 1920x1080 and 1280x720, then a Pale transfer.
        testMapShots {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'mapshots'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The landing aids and re-entry screenshots by script: a 1,700 m lander burn, a dive, chutes, and the rim at three times of day.
        testM07 {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'm07'
            systemProperty 'apoapsis.testStart', 'pad'
            systemProperty 'apoapsis.testSave', 'Apoapsis M07 Test'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // The whole way home by script, as one run: Pale landing, Pale ascent, transfer back, re-entry with chutes and the
        // landing on legs; telemetry CSV and m09-*.png into run/screenshots, then quits. The ship is the Kestrel with four
        // chutes and four legs. -PreturnStage=ascent|escape|entry starts a later leg from a labelled stage start.
        testReturn {
            client()
            systemProperty 'apoapsis.testFlight', 'true'
            systemProperty 'apoapsis.testDriver', 'return'
            systemProperty 'apoapsis.testShip', 'lander'
            systemProperty 'apoapsis.testSave', 'Apoapsis Return Test'
            systemProperty 'apoapsis.returnStage', project.findProperty('returnStage') ?: 'full'
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':orbit').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':orbit')
}

// The scripted runs with their own save start from a fresh world: each deletes its save folder before it launches.
def freshSaves = [runTestAscent: 'Apoapsis Ascent Test', runTestAscentRecord: 'Apoapsis Ascent Test',
        runTestPale: 'Apoapsis Pale Test', runTestLand: 'Apoapsis Land Test', runTestM07: 'Apoapsis M07 Test',
        runTestReturn: 'Apoapsis Return Test']
tasks.matching { freshSaves.containsKey(it.name) }.configureEach { task ->
    task.doFirst { file("run/saves/${freshSaves[task.name]}").deleteDir() }
}

// The orbit library ships inside the mod jar, so players install one file.
tasks.named('jar', Jar) {
    from(project(':orbit').sourceSets.main.output)
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
    archiveVersion = "${mod_version}+${minecraft_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Each module keeps its own strings in src/main/lang/<locale>/<module>.json; they are merged here so
// parallel work never edits one shared file. A key defined twice fails the build.
var mergeLang = tasks.register('mergeLang') {
    var srcDir = file('src/main/lang')
    var outDir = layout.buildDirectory.dir('generated/sources/lang')
    inputs.dir(srcDir)
    outputs.dir(outDir)
    doLast {
        var slurper = new groovy.json.JsonSlurper()
        srcDir.eachDir { localeDir ->
            var merged = new TreeMap<String, Object>()
            localeDir.listFiles().findAll { it.name.endsWith('.json') }.sort { it.name }.each { f ->
                (slurper.parse(f) as Map).each { k, v ->
                    if (merged.containsKey(k)) throw new GradleException("Duplicate lang key ${k} in ${f.name}")
                    merged[k] = v
                }
            }
            var out = outDir.get().file("assets/${mod_id}/lang/${localeDir.name}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('generated/sources/lang')).builtBy(mergeLang))
neoForge.ideSyncTask mergeLang

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
