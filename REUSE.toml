version = 1

[[annotations]]
path = ["docs/design/**", "docs/plan/**", "docs/releases/**", "README.md", "CONTRIBUTING.md", "CHANGELOG.md"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Research notes: our own text is CC BY 4.0. Short quotations and restated wiki
# data inside them remain under their sources' licences (see docs/research/README.md).
[[annotations]]
path = ["docs/research/**"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Concept art: CC BY 4.0, each image credited to its artist in docs/design/13-art-direction.md (Concept art log).
[[annotations]]
path = ["docs/concept/**"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tools/**", "REUSE.toml", ".gitignore"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "MIT"

# Code, build files and data: MIT.
[[annotations]]
path = ["src/**/*.java", "orbit/**", "*.gradle", "gradle.properties", "gradle/**", "gradlew", "gradlew.bat", ".github/**", "src/main/templates/**", "src/main/lang/**", "src/main/resources/**/*.json"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "MIT"

# Art and docs: CC BY 4.0. Listed after the MIT block so they win where they overlap
# (model files are JSON, so they also match src/main/resources/**/*.json).
[[annotations]]
path = ["src/main/resources/assets/**/textures/**", "src/main/resources/assets/**/models/**", "docs/dev/**"]
SPDX-FileCopyrightText = "2026 The Apoapsis contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# UI fonts (IMM-MENU): Barlow Condensed and Chakra Petch, SIL OFL 1.1, unmodified. Each OFL.txt travels with its font.
[[annotations]]
path = ["src/main/resources/assets/apoapsis/font/barlow-condensed-*"]
SPDX-FileCopyrightText = "Copyright 2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/main/resources/assets/apoapsis/font/chakra-petch-*"]
SPDX-FileCopyrightText = "Copyright 2018 The Chakra Petch Project Authors (https://github.com/m4rc1e/Chakra-Petch.git)"
SPDX-License-Identifier = "OFL-1.1"
